<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Neon Circuit 3D</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#081018;touch-action:none;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
canvas{display:block;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none;color:#fff}
.top{display:flex;justify-content:space-between;align-items:flex-start;padding:calc(12px + env(safe-area-inset-top)) 14px 0}
.panel{background:linear-gradient(135deg,rgba(7,15,26,.72),rgba(20,35,50,.42));border:1px solid rgba(255,255,255,.15);border-radius:14px;padding:10px 13px;backdrop-filter:blur(8px);box-shadow:0 8px 25px #0004}
#speed{font-size:34px;font-weight:900;letter-spacing:-1px;line-height:1}
#unit{font-size:11px;color:#9db3c9;letter-spacing:2px}
#status{font-size:12px;color:#c4d4e5;margin-top:5px}
#lap{font-weight:800;font-size:15px}
#help{position:absolute;top:78px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:12px;color:#c5d3e0;background:#06111b88;padding:7px 12px;border-radius:99px}
.controls{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));width:100%;display:flex;justify-content:space-between;align-items:flex-end;padding:0 18px;pointer-events:auto}
.cluster{display:flex;gap:10px;align-items:flex-end}
.btn{width:66px;height:66px;border-radius:18px;border:1px solid #ffffff30;background:linear-gradient(150deg,#ffffff20,#071725bb);color:#fff;font-size:23px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px #0006;touch-action:none;outline:none;-webkit-tap-highlight-color:transparent}
.btn:active,.btn.down{background:linear-gradient(150deg,#22d3ee70,#0a2439);transform:scale(.96);border-color:#4de5ff80}
.btn.small{width:58px;height:58px;font-size:18px}
.btn.gas{width:76px;height:76px;background:linear-gradient(150deg,#37e69a55,#063124cc);border-color:#49e8ad66}
.btn.brake{background:linear-gradient(150deg,#ff6b6b55,#3b111dcc)}
@media(min-width:800px){.controls{opacity:.65}.btn{width:72px;height:72px}.btn.gas{width:82px;height:82px}}
#minimap{position:absolute;right:14px;top:118px;width:130px;height:130px;border:1px solid #ffffff35;border-radius:12px;background:#07111bbd;backdrop-filter:blur(6px)}\n#message{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:20px;font-weight:800;text-align:center;display:none;text-shadow:0 3px 12px #000;background:#07111bd9;padding:24px 28px;border-radius:20px;border:1px solid #ffffff30;min-width:260px}\n#message button{pointer-events:auto;margin-top:15px;padding:12px 18px;border:0;border-radius:12px;background:#13bde8;color:#06202c;font-weight:900;font-size:16px}
</style>
</head>
<body>
<div id="hud">
 <div class="top">
  <div class="panel"><div id="speed">0</div><div id="unit">KM/H</div><div id="brand">NEON CIRCUIT</div></div>
  <div class="panel"><div id="lap">КРУГ 1 / 3</div><div id="raceStatus">⏱ <span id="time">00:00.0</span></div><div id="best">🏆 Лучший: --:--.-</div><div id="hits">💥 Столкновения: 0</div></div>
 </div>
 <div id="help">WASD / стрелки · телефон — кнопки снизу <button id="tilt" style="pointer-events:auto;border:0;border-radius:8px;padding:4px 7px;margin-left:5px;background:#12bce4;color:#04212b;font-weight:800">Наклон</button></div>
 <div class="controls">
  <div class="cluster">
   <button class="btn" id="left" aria-label="Влево">◀</button>
   <button class="btn" id="right" aria-label="Вправо">▶</button>
  </div>
  <div class="cluster">
   <button class="btn small brake" id="brake">▼</button>
   <button class="btn gas" id="gas">▲</button>
  </div>
 </div>
 <canvas id="minimap" width="260" height="260"></canvas><div id="message"></div>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x91b8d2);
scene.fog=new THREE.Fog(0x91b8d2,120,420);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,700);
const renderer=new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xd7efff,0x34502c,2.2));
const sun=new THREE.DirectionalLight(0xfff2d8,3.1);sun.position.set(-60,100,40);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-100;sun.shadow.camera.right=100;sun.shadow.camera.top=100;sun.shadow.camera.bottom=-100;scene.add(sun);

const mat=(color,rough=.7,metal=0)=>new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal});
const grass=mat(0x47794c),roadMat=mat(0x242b34,.92),edgeMat=mat(0xe9e9e9),redMat=mat(0xe74a42),whiteMat=mat(0xffffff),dark=mat(0x101820,.4,.25),glass=mat(0x16334a,.22,.35),tire=mat(0x090b0e),rim=mat(0xb4c2cc,.28,.75),paint=mat(0x08b9f5,.26,.5);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(900,900),grass);ground.rotation.x=-Math.PI/2;ground.position.y=-.12;ground.receiveShadow=true;scene.add(ground);

// Oval-ish flowing circuit spline
const pts=[
 new THREE.Vector3(-42,0,-90),new THREE.Vector3(30,0,-102),new THREE.Vector3(82,0,-72),
 new THREE.Vector3(104,0,-18),new THREE.Vector3(84,0,42),new THREE.Vector3(40,0,88),
 new THREE.Vector3(-28,0,96),new THREE.Vector3(-88,0,62),new THREE.Vector3(-108,0,8),
 new THREE.Vector3(-92,0,-48)
];
const track=new THREE.CatmullRomCurve3(pts,true,'catmullrom',.35);
const N=480, roadWidth=18, samples=[];
for(let i=0;i<=N;i++){let t=i/N,p=track.getPointAt(t),tan=track.getTangentAt(t);let side=new THREE.Vector3(-tan.z,0,tan.x).normalize();samples.push({p,tan,side});}
function ribbon(offset,width,y,material){
 let verts=[],indices=[];
 for(let i=0;i<=N;i++){let s=samples[i],a=s.p.clone().addScaledVector(s.side,offset-width/2);let b=s.p.clone().addScaledVector(s.side,offset+width/2);a.y=y;b.y=y;verts.push(a.x,a.y,a.z,b.x,b.y,b.z);}
 for(let i=0;i<N;i++){let k=i*2;indices.push(k,k+1,k+2,k+1,k+3,k+2);}
 let geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));geo.setIndex(indices);geo.computeVertexNormals();
 let mesh=new THREE.Mesh(geo,material);mesh.receiveShadow=true;scene.add(mesh);return mesh;
}
ribbon(0,roadWidth,.02,roadMat);
ribbon(-roadWidth/2-.6,1.1,.035,edgeMat);ribbon(roadWidth/2+.6,1.1,.035,edgeMat);
ribbon(-roadWidth/2-.6,1.1,.04,redMat);ribbon(roadWidth/2+.6,1.1,.04,redMat);
// center broken line
for(let i=0;i<120;i+=2){let a=samples[Math.floor(i*N/120)],b=samples[Math.floor((i+1)*N/120)];let d=a.p.distanceTo(b.p);let mesh=new THREE.Mesh(new BoxGeometry(0.22,.025,d*.85),whiteMat);mesh.position.copy(a.p).add(b.p).multiplyScalar(.5);mesh.position.y=.055;mesh.rotation.y=Math.atan2(b.p.x-a.p.x,b.p.z-a.p.z);scene.add(mesh);}
function BoxGeometry(w,h,d){return new THREE.BoxGeometry(w,h,d)}
// Barriers along outer track edge
for(let sideVal of [-1,1]){
 for(let i=0;i<N;i+=3){let s=samples[i],p=s.p.clone().addScaledVector(s.side,sideVal*(roadWidth/2+2.3));p.y=.65;
  let b=new THREE.Mesh(new BoxGeometry(2.3,1.2,.65),i%12<6?whiteMat:redMat);b.position.copy(p);b.rotation.y=Math.atan2(s.tan.x,s.tan.z);b.castShadow=true;b.receiveShadow=true;scene.add(b);}
}
// Start stripe
let st=samples[0],stripe=new THREE.Mesh(new BoxGeometry(roadWidth,.06,2.2),whiteMat);stripe.position.copy(st.p);stripe.position.y=.07;stripe.rotation.y=Math.atan2(st.tan.x,st.tan.z);scene.add(stripe);

// Scenery trees, lamps, distant hills
const trunkMat=mat(0x5b3825),leafMat=mat(0x2f6b40),leaf2=mat(0x438a4e);
for(let i=0;i<170;i++){
 let s=samples[(i*17)%N],side=s.side,offset=(roadWidth/2+9+Math.random()*42)*(i%2?1:-1),p=s.p.clone().addScaledVector(side,offset);
 if(p.length()<28)continue;
 let trunk=new THREE.Mesh(new THREE.CylinderGeometry(.35,.55,3.2,7),trunkMat);trunk.position.set(p.x,1.6,p.z);trunk.castShadow=true;scene.add(trunk);
 let crown=new THREE.Mesh(new THREE.IcosahedronGeometry(2.3+Math.random()*2.4,1),i%3?leafMat:leaf2);crown.position.set(p.x,4.1+Math.random()*1.5,p.z);crown.castShadow=true;scene.add(crown);
}
for(let i=0;i<42;i++){let s=samples[(i*11)%N],p=s.p.clone().addScaledVector(s.side,roadWidth/2+7);let pole=new THREE.Mesh(new CylinderGeometry(.12,.16,6,8),dark);pole.position.set(p.x,3,p.z);scene.add(pole);let lamp=new THREE.Mesh(new SphereGeometry(.35,8,8),mat(0xffe8a4,.3,0));lamp.position.set(p.x,6,p.z);scene.add(lamp);}
function CylinderGeometry(a,b,c,d){return new THREE.CylinderGeometry(a,b,c,d)}
function SphereGeometry(r,w,h){return new THREE.SphereGeometry(r,w,h)}

// Car model
const car=new THREE.Group();scene.add(car);
const body=new THREE.Mesh(new BoxGeometry(2.05,.58,4.25),paint);body.position.y=.72;body.castShadow=true;car.add(body);
const hood=new THREE.Mesh(new BoxGeometry(1.85,.28,1.3),paint);hood.position.set(0,1.03,-1.35);car.add(hood);
const cabin=new THREE.Mesh(new BoxGeometry(1.48,.72,1.72),glass);cabin.position.set(0,1.35,.18);cabin.castShadow=true;car.add(cabin);
const roof=new THREE.Mesh(new BoxGeometry(1.3,.12,.85),dark);roof.position.set(0,1.74,.15);car.add(roof);
const front=new THREE.Mesh(new BoxGeometry(1.7,.18,.12),mat(0xeffaff,.3));front.position.set(0,.68,-2.12);car.add(front);
const rear=new THREE.Mesh(new BoxGeometry(1.75,.17,.12),mat(0xff263b,.3));rear.position.set(0,.7,2.12);car.add(rear);
const spoiler=new THREE.Mesh(new BoxGeometry(2.2,.13,.25),dark);spoiler.position.set(0,1.38,1.92);car.add(spoiler);
const wheels=[];
for(let x of [-1.05,1.05])for(let z of [-1.35,1.35]){
 let w=new THREE.Mesh(new CylinderGeometry(.48,.48,.34,20),tire);w.rotation.z=Math.PI/2;w.position.set(x,.48,z);w.castShadow=true;car.add(w);wheels.push(w);
 let r=new THREE.Mesh(new CylinderGeometry(.27,.27,.36,16),rim);r.rotation.z=Math.PI/2;r.position.set(x,.48,z);car.add(r);
}
car.position.copy(st.p);car.position.y=0;car.rotation.y=Math.atan2(st.tan.x,st.tan.z);

// collision objects
const obstacles=[];
function addObstacle(p,geometry,material){let m=new THREE.Mesh(geometry,material);m.position.copy(p);m.castShadow=true;scene.add(m);obstacles.push(m);}
for(let i=0;i<30;i++){let s=samples[(i*13+71)%N],p=s.p.clone().addScaledVector(s.side,(i%2?1:-1)*(roadWidth/2-2.8));p.y=.7;addObstacle(p,new BoxGeometry(1.1,1.4,1.1),mat(0xffb22d));}
let speed=0,steer=0,heading=car.rotation.y,elapsed=0,lap=1,prevT=0,progress=0,hitCooldown=0,collisionCount=0,lapStart=0,bestLap=null,raceFinished=false,finishTime=0;
const input={left:false,right:false,gas:false,brake:false};
function bind(id,key){let e=document.getElementById(id);
 const on=(ev)=>{ev.preventDefault();input[key]=true;e.classList.add('down');};
 const off=(ev)=>{ev.preventDefault();input[key]=false;e.classList.remove('down');};
 e.addEventListener('pointerdown',on);e.addEventListener('pointerup',off);e.addEventListener('pointercancel',off);e.addEventListener('pointerleave',off);
}
bind('left','left');bind('right','right');bind('gas','gas');bind('brake','brake');document.getElementById('tilt').addEventListener('click',enableTilt);
window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key==='ArrowUp'||e.key.toLowerCase()==='w')input.gas=true;if(e.key==='ArrowDown'||e.key.toLowerCase()==='s')input.brake=true;if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')input.left=true;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')input.right=true;});
window.addEventListener('keyup',e=>{if(e.key==='ArrowUp'||e.key.toLowerCase()==='w')input.gas=false;if(e.key==='ArrowDown'||e.key.toLowerCase()==='s')input.brake=false;if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')input.left=false;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')input.right=false;});
let tiltEnabled=false,tiltSteer=0;
function enableTilt(){
 if(!('DeviceOrientationEvent' in window)){alert('Наклон не поддерживается на этом устройстве.');return;}
 const req=DeviceOrientationEvent.requestPermission;
 if(req){req().then(state=>{if(state==='granted'){tiltEnabled=true;window.addEventListener('deviceorientation',handleTilt);}}).catch(()=>alert('Разрешение на наклон не получено.'));}
 else {tiltEnabled=true;window.addEventListener('deviceorientation',handleTilt);}
}
function handleTilt(e){if(e.gamma!=null)tiltSteer=THREE.MathUtils.clamp(e.gamma/25,-1,1);}
function closestT(pos){let best=0,dist=1e9;for(let i=0;i<N;i+=3){let d=pos.distanceToSquared(samples[i].p);if(d<dist){dist=d;best=i/N;}}return best;}
const clock=new THREE.Clock();
function formatTime(t){let m=Math.floor(t/60),s=t%60;return String(m).padStart(2,'0')+':'+s.toFixed(1).padStart(4,'0');}
function loop(){
 requestAnimationFrame(loop);let dt=Math.min(clock.getDelta(),.04);if(!raceFinished)elapsed+=dt;
 let throttle=(!raceFinished&&input.gas)?1:0,brake=(!raceFinished&&input.brake)?1:0;
 if(throttle)speed+=23*dt;else speed-=3.5*dt;
 if(brake)speed-=38*dt;
 speed=THREE.MathUtils.clamp(speed,-7,48);
 let turn=(input.left?1:0)-(input.right?1:0);if(tiltEnabled)turn=tiltSteer;
 let speedFactor=Math.min(Math.abs(speed)/12,1);
 steer=THREE.MathUtils.lerp(steer,turn,.12);frontWheelPivots.forEach(p=>p.rotation.y=steer*.38);
 heading+=steer*speedFactor*1.65*dt*Math.sign(speed||1);
 let forward=new THREE.Vector3(Math.sin(heading),0,Math.cos(heading));
 car.position.addScaledVector(forward,speed*dt);
 car.rotation.y=heading;
 car.position.y=0;
 wheels.forEach(w=>{w.rotation.x+=speed*dt*2.2;});
 // boundary recovery & barrier impact
 let t=closestT(car.position),s=samples[Math.floor(t*N)];
 let lateral=car.position.clone().sub(s.p).dot(s.side);
 if(Math.abs(lateral)>roadWidth/2-1.1){
   if(hitCooldown<=0){speed*=.48;hitCooldown=.65;collisionCount++;document.getElementById('hits').textContent='💥 Столкновения: '+collisionCount;}
   lateral=THREE.MathUtils.clamp(lateral,-roadWidth/2+1.1,roadWidth/2-1.1);
   car.position.copy(s.p).addScaledVector(s.side,lateral);
 }
 hitCooldown=Math.max(0,hitCooldown-dt);
 for(let o of obstacles){if(car.position.distanceTo(o.position)<1.7){if(hitCooldown<=0){collisionCount++;document.getElementById('hits').textContent='💥 Столкновения: '+collisionCount;hitCooldown=.45;}speed*=.65;let away=car.position.clone().sub(o.position).normalize();car.position.addScaledVector(away,.12);}}
 // lap tracking crossing start
 if(prevT>.88&&t<.12&&speed>5){lap++;if(lap>3){lap=1;elapsed=0;}document.getElementById('lap').textContent=`КРУГ ${lap} / 3`;}
 prevT=t;
 // camera chase smooth
 let camOffset=new THREE.Vector3(0,5.2,-10.8).applyAxisAngle(new THREE.Vector3(0,1,0),heading);
 let target=car.position.clone().add(camOffset);camera.position.lerp(target,1-Math.pow(.001,dt));camera.lookAt(car.position.clone().add(new THREE.Vector3(0,1.1,0)).addScaledVector(forward,3));
 document.getElementById('speed').textContent=Math.round(Math.abs(speed)*3.6);
 document.getElementById('time').textContent=formatTime(elapsed);
 renderer.render(scene,camera);
}
loop();
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
